[project]
name = "stockreplay"
version = "1.0.0"
description = "A local, reproducible market research laboratory"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.9,<3",
  "httpx>=0.27,<1", "numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "yfinance>=0.2.65,<2", "exchange-calendars>=4.6,<5", "beautifulsoup4>=4.12,<5",
  "keyring>=25,<26; sys_platform == 'darwin'"
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
