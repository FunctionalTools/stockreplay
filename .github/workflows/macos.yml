name: macOS verification
on:
  push:
  workflow_dispatch:
    inputs:
      live_providers:
        description: Verify current public prices, news and analyst estimates
        type: boolean
        default: false
      live_ollama:
        description: Download a free local model and exercise sourced generation on Apple silicon
        type: boolean
        default: false
      live_forecast:
        description: Generate a homepage forecast from live data with local Ollama on Apple silicon
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  macos:
    name: macOS verification (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      STOCKREPLAY_INSTALL_BROWSERS: "1"
      STOCKREPLAY_NO_BROWSER: "1"
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
      - name: Install and build on macOS
        run: ./setup.sh
      - name: Run deterministic engine and interface tests
        run: |
          .venv/bin/python -m pytest -q
          npm --prefix frontend test
          npm --prefix frontend run e2e
      - name: Exercise the workspace in WebKit
        working-directory: frontend
        env:
          STOCKREPLAY_BROWSER: webkit
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$PWD/../.local/browsers"
          ./node_modules/.bin/playwright install webkit
          npm run e2e
      - name: Reopen saved work after restarting the local service
        env:
          STOCKREPLAY_HOME: ${{ runner.temp }}/stockreplay-restart
        run: |
          ./start.sh
          api=http://127.0.0.1:8765/api
          tab=$(curl -fsS "$api/tabs" --json '{"title":"Restart check","blocks":[{"view":"note","value":"Saved on this Mac"}]}' | jq -er '.id')
          chat=$(curl -fsS "$api/assistant/chats" --json '{"title":"Restart check"}' | jq -er '.id')
          curl -fsS -X PUT "$api/assistant/chats/$chat" --json '{"revision":0,"entries":[{"id":1,"role":"user","text":"Where is my portfolio?"}],"context":[]}' > /dev/null
          ./stop.sh
          ./start.sh
          curl -fsS "$api/tabs/$tab" | jq -e '.blocks[0].value == "Saved on this Mac"'
          curl -fsS "$api/assistant/chats/$chat" | jq -e '.entries[0].text == "Where is my portfolio?"'
          ./stop.sh
      - name: Verify current public sources on macOS
        if: github.event_name == 'workflow_dispatch' && inputs.live_providers && matrix.runner == 'macos-15'
        env:
          STOCKREPLAY_PUBLIC_LIVE: "1"
          STOCKREPLAY_LIVE_TESTS: "1"
        run: |
          .venv/bin/python -m pytest -q -s tests/test_terminal.py::test_live_public_sources tests/test_live_research.py tests/test_web_research.py::test_live_company_lookup_reads_actual_documents tests/test_market_events.py::test_live_senate_agenda_and_upcoming_market_events
      - name: Verify live market research in the browser
        if: always() && github.event_name == 'workflow_dispatch' && inputs.live_providers && matrix.runner == 'macos-15'
        env:
          STOCKREPLAY_LIVE_TESTS: "1"
        run: npm --prefix frontend run e2e -- terminal.spec.ts reported-future-live.spec.ts --grep "live public research"
      - name: Verify the selected OpenAI model with a dedicated project key when available
        if: github.event_name == 'workflow_dispatch' && inputs.live_providers && matrix.runner == 'macos-15'
        env:
          STOCKREPLAY_TEST_OPENAI_KEY: ${{ secrets.STOCKREPLAY_TEST_OPENAI_KEY }}
        run: .venv/bin/python -m pytest -q -rs tests/test_terminal.py -k live_openai_generation
      - name: Verify ticker lookup predictions using available website keys
        if: github.event_name == 'workflow_dispatch' && inputs.live_providers && matrix.runner == 'macos-15'
        env:
          STOCKREPLAY_TEST_OPENAI_KEY: ${{ secrets.STOCKREPLAY_TEST_OPENAI_KEY }}
          STOCKREPLAY_TEST_OLLAMA_CLOUD_KEY: ${{ secrets.STOCKREPLAY_TEST_OLLAMA_CLOUD_KEY }}
        run: .venv/bin/python -m pytest -q -rs tests/test_hosted_auto_forecast.py
      - name: Verify Ollama website search and hosted generation when a dedicated key is available
        if: github.event_name == 'workflow_dispatch' && inputs.live_providers && matrix.runner == 'macos-15'
        env:
          STOCKREPLAY_TEST_OLLAMA_CLOUD_KEY: ${{ secrets.STOCKREPLAY_TEST_OLLAMA_CLOUD_KEY }}
          STOCKREPLAY_TEST_OLLAMA_SEARCH_KEY: ${{ secrets.STOCKREPLAY_TEST_OLLAMA_SEARCH_KEY }}
        run: .venv/bin/python -m pytest -q -rs tests/test_ollama_cloud.py::test_live_search_only_key tests/test_ollama_web.py::test_real_ollama_website_search tests/test_ollama_cloud.py::test_live_ollama_cloud_generation_and_web_search
  local-generation:
    name: Free local generation on Apple silicon
    if: github.event_name == 'workflow_dispatch' && (inputs.live_ollama || inputs.live_forecast)
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install StockReplay backend
        run: uv sync --frozen
      - uses: actions/setup-node@v4
        if: inputs.live_forecast
        with:
          node-version: "22"
      - name: Build and install the browser for a real ticker lookup
        if: inputs.live_forecast
        working-directory: frontend
        run: |
          npm ci
          npm run build
          PLAYWRIGHT_BROWSERS_PATH="$PWD/../.local/browsers" ./node_modules/.bin/playwright install chromium
      - name: Run the free model against live public evidence
        shell: bash
        env:
          OLLAMA_NO_CLOUD: "1"
          OLLAMA_HOST: "127.0.0.1:11434"
          STOCKREPLAY_LIVE_OLLAMA: "1"
          STOCKREPLAY_PUBLIC_LIVE: "1"
          VERIFY_SCORES: ${{ inputs.live_ollama }}
          VERIFY_FORECAST: ${{ inputs.live_forecast }}
          PYTHONUNBUFFERED: "1"
          STOCKREPLAY_TEST_OLLAMA_MODEL: qwen2.5:3b
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ollama-runtime"
          cd "$RUNNER_TEMP/ollama-runtime"
          curl -fsSL --retry 3 -o ollama-darwin.tgz https://github.com/ollama/ollama/releases/download/v0.40.19/ollama-darwin.tgz
          echo 'c335802128e9ac33fc0599fa9da661c3d44fbe0dc0176bb6a2f4134386205942  ollama-darwin.tgz' | shasum -a 256 -c -
          tar -xzf ollama-darwin.tgz
          executable="$PWD/ollama"
          test -x "$executable"
          export OLLAMA_MODELS="$RUNNER_TEMP/ollama-models"
          "$executable" serve > "$RUNNER_TEMP/ollama-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 -fsS "http://$OLLAMA_HOST/api/version"
          "$executable" pull "$STOCKREPLAY_TEST_OLLAMA_MODEL"
          cd "$GITHUB_WORKSPACE"
          if [ "$VERIFY_SCORES" = true ]; then
            .venv/bin/python -m pytest -q -s tests/test_live_ollama.py tests/test_local_ai.py::test_real_local_model_uses_the_generation_paths
          fi
          if [ "$VERIFY_FORECAST" = true ]; then
            STOCKREPLAY_LIVE_TESTS=1 npm --prefix frontend run e2e -- live-auto-prediction.spec.ts
          fi
